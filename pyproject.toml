[project]
name = "gitignore-generator"
version = "0.2.1"
requires-python = ">=3.9"
authors = [{name = "chinyu.chien"}]
license = {text = "MIT"}
keywords = ["gitignore", "cli", "git", "template"]
dependencies = [
    "pyinstaller>=6.22.2",
]

[project.scripts]
gitignore-generator = "gitignore_generator.cli:main"

[project.urls]
Homepage = "https://github.com/pomelyu/gitignore-generator"
Repository = "https://github.com/pomelyu/gitignore-generator"
Documentation = "https://github.com/pomelyu/gitignore-generator#readme"
"Bug Tracker" = "https://github.com/pomelyu/gitignore-generator/issues"

[dependency-groups]
dev = [
    "isort>=6.1.0",
    "pylint>=3.3.9",
    "pyinstaller>=6.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "gitignore_generator"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
line_length = 100
force_single_line = true

[tool.pylint.messages_control]
disable = ["W0718"]

[tool.pylint.format]
max-line-length = 120
