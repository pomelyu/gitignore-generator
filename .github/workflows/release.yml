name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Set up Python and dependencies
      run: uv sync --locked --python 3.12

    - name: Run tests
      run: |
        uv run pytest tests/ -v

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gitignore-generator-linux
          - os: windows-latest
            artifact: gitignore-generator.exe
          - os: macos-latest
            artifact: gitignore-generator-macos

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Set up Python and dependencies
      run: uv sync --locked --python 3.12

    - name: Build with PyInstaller
      run: |
        uv run pyinstaller --clean --noconfirm gitignore_generator.spec

    - name: Rename artifact
      run: |
        python -c "from pathlib import Path; files=list(Path('dist').glob('gitignore-generator*')); assert len(files) == 1, files; files[0].rename(Path('dist') / '${{ matrix.artifact }}')"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist/${{ matrix.artifact }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist-artifacts

    - name: Organize artifacts
      run: |
        mkdir -p release-artifacts
        find dist-artifacts -type f ! -name ".*" -exec cp {} release-artifacts/ \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-artifacts/*
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
